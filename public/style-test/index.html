<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Avatar Style Preview</title>
<style>
  body { background: #0f0f13; color: #fff; font-family: system-ui; margin: 0; padding: 24px; }
  h1 { text-align: center; font-size: 20px; color: #a78bfa; margin-bottom: 32px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 1000px; margin: 0 auto; }
  .card { background: #1a1a2e; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
  .card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .label { padding: 12px; text-align: center; }
  .label h3 { margin: 0 0 4px; font-size: 14px; color: #e2e8f0; }
  .label p { margin: 0; font-size: 11px; color: #94a3b8; }
</style>
</head>
<body>
<h1>🎭 Avatar Style Pack Preview</h1>
<div class="grid">
  <div class="card">
    <img src="semi-realistic.png" alt="Semi-Realistic">
    <div class="label">
      <h3>Semi-Realistic</h3>
      <p>Painterly game art, Arcane-inspired</p>
    </div>
  </div>
  <div class="card">
    <img src="anime.png" alt="Anime">
    <div class="label">
      <h3>Anime</h3>
      <p>Japanese cel-shaded illustration</p>
    </div>
  </div>
  <div class="card">
    <img src="painted.png" alt="Painted Portrait">
    <div class="label">
      <h3>Painted Portrait</h3>
      <p>Dark Renaissance oil painting</p>
    </div>
  </div>
  <div class="card">
    <img src="pixel.png" alt="Pixel Art">
    <div class="label">
      <h3>Pixel Art</h3>
      <p>Retro 16-bit RPG style</p>
    </div>
  </div>
</div>
</body>
</html>
